<script>
/* Proview Reservations: the public booking page.

async function loadDays(){const my=seq;U.od="load";render();try{const r=await call("days",rq({date:U.date,size:U.size}));if(my!==seq)return;U.od=r.days||[]}catch(e){if(my!==seq)return;U.od=[]}render()}
function daysHtml(){const o=U.od,b=o===null?"":o==="load"?`<p class="muted small">Looking\u2026</p>`:!o.length?`<p class="muted small">Nothing else free online in the next three weeks.</p>`:`<div class="sh-ol">${o.map(d=>`<button type="button" data-a="day" data-d="${d.date}"><b>${esc(fmtD(d.date))}</b><span>${d.count} time${d.count===1?"":"s"} free</span></button>`).join("")}</div>`;
  return`<details class="sh-od" ${U.odOpen?"open":""}><summary data-a="odtog">Other dates with availability</summary>${b}</details>`}
function aboutHtml(){const L=V&&V.look||{},ab=L.about?`<section class="sh-ab"><h2>About ${esc(V.name)}</h2><p>${esc(L.about).replace(/\n/g,"<br>")}</p></section>`:"",mp=L.addr&&L.map!=="off"&&!EMBED?`<section class="sh-ab"><h2>Find us</h2><p class="muted" style="margin:0 0 8px">${esc(L.addr)} \u00b7 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(V.name+", "+L.addr)}" target="_blank" rel="noopener">Open in Google Maps</a></p><iframe class="sh-map" loading="lazy" referrerpolicy="no-referrer" title="Map" src="https://www.google.com/maps?q=${encodeURIComponent(V.name+", "+L.addr)}&output=embed"></iframe></section>`:"";return ab+mp}
async function alertSend(e){e.preventDefault();if(U.busy)return;const f=U.f;f.name=$("#f-name").value.trim();f.email=$("#f-email").value.trim();f.phone=$("#f-phone").value.trim();const web=$("#f-web").value;
  if(f.name.length<2){U.err="Please enter your name.";render();$("#f-name").focus();return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){U.err="Please enter your email address so we can tell you.";render();$("#f-email").focus();return}
  U.busy=true;U.err="";render();
  try{await call("alert",{},{date:U.date,size:U.size,room:rq({}).room||"",name:f.name,email:f.email,phone:f.phone,website:web});U.busy=false;U.step="alerted";render();scrollTo(0,0)}
  catch(err){U.busy=false;U.err=err.message;render()}}
async function submit(e){e.preventDefault();if(U.busy)return;const f=U.f;
  f.name=$("#f-name").value.trim();f.phone=$("#f-phone").value.trim();f.email=$("#f-email").value.trim();f.notes=$("#f-notes").value.trim();f.mk=$("#f-mk").checked;const web=$("#f-web").value;
  if(f.name.length<2){U.err="Please enter your name.";render();$("#f-name").focus();return}
  if(f.phone.replace(/\D/g,"").length<7){U.err="Please enter a phone number we can reach you on.";render();$("#f-phone").focus();return}
  if(!f.email){U.err="Please enter your email address so we can send your confirmation.";render();$("#f-email").focus();return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){U.err="That email address does not look right.";render();$("#f-email").focus();return}
  U.busy=true;U.err="";render();
  try{const r=await call("book",{},{date:U.date,time:U.time,size:U.size,room:rq({}).room||"",name:f.name,phone:f.phone,email:f.email,notes:f.notes,mk:!!(f.email&&f.mk),website:web});U.busy=false;U.done=r;U.step="done";render();scrollTo(0,0)}
  catch(err){U.busy=false;if(err.code==="gone"){U.step="pick";U.err=err.message;loadTimes();return}U.err=err.message;render()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="per"){U.per=b.dataset.v;render();return}
  if(a==="alert"){U.step="alert";U.err="";render();scrollTo(0,0);return}
  if(a==="odtog"){e.preventDefault();U.odOpen=!U.odOpen;if(U.odOpen&&U.od===null)loadDays();else render();return}
  if(a==="time"&&b.dataset.r!=null)U.room=b.dataset.r;
  if(a==="nxt"){const t=b.dataset.t;U.date=b.dataset.d;U.cm=U.date.slice(0,7);U.times=(U.next&&U.next.times)||[t];U.why="";U.next=null;U.time=t;if(U.am){doAmend("change",rq({date:U.date,time:U.time,size:U.size}))}else{U.step="form";U.err="";render();scrollTo(0,0);const n=$("#f-name");if(n&&!n.value)try{n.focus()}catch(x){}}}
  else if(a==="calopen"){U.calOpen=true;U.cm=U.date.slice(0,7);render()}
  else if(a==="day"){U.date=b.dataset.d;U.cm=U.date.slice(0,7);U.calOpen=false;loadTimes()}
  else if(a==="size"){U.size=+b.dataset.n;loadTimes()}
  else if(a==="room"){U.room=b.dataset.v;loadTimes()}
  else if(a==="mon"){const y=+U.cm.slice(0,4),m=+U.cm.slice(5,7)-1+(+b.dataset.v),d=new Date(Date.UTC(y,m,1,12));U.cm=d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1);render()}
  else if(a==="time"&&U.am){U.time=b.dataset.t;doAmend("change",rq({date:U.date,time:U.time,size:U.size}))}
  else if(a==="find"){U.step="find";U.err="";render();scrollTo(0,0)}
  else if(a==="amback"){U.am=null;U.step="pick";U.err="";loadTimes()}
  else if(a==="amchange"){const x=U.am.b;U.room=RMS().includes(x.room)?x.room:"";U.size=Math.min(x.size,V.maxParty);U.date=x.date<V.today?V.today:x.date;U.cm=U.date.slice(0,7);U.step="pick";U.err="";loadTimes()}
  else if(a==="amask"){U.step="ask";U.err="";render()}
  else if(a==="amcancel"){doAmend("cancel")}
  else if(a==="amkeep"||a==="amkeep2"){U.step="manage";U.err="";render()}
  else if(a==="time"){U.time=b.dataset.t;U.step="form";U.err="";render();scrollTo(0,0);const n=$("#f-name");if(n&&!n.value)try{n.focus()}catch(x){}}
  else if(a==="back"){U.step="pick";U.err="";loadTimes()}
  else if(a==="again"){U.am=null;U.step="pick";U.done=null;U.time="";U.f.notes="";loadTimes()}});
(async function start(){
  try{const c=await (await fetch("../cloud.json",{cache:"no-store"})).json();API=c.url.replace(/\/$/,"")+"/functions/v1/res-book";KEY=c.key}catch(e){fail("Cannot connect","Check the internet and try again.");return}
  if(!SITE){V={name:"Book a table"};fail("This booking link is not complete","Please ask the venue for their booking link.");return}
  try{V=await call("info")}catch(e){V={name:"Book a table"};fail(e.status===404?"Booking link not found":"Cannot connect",e.message);return}
  document.title=(V.label||"Book a table")+" · "+V.name;applyLook(V.look);
  if(!V.on){fail("Online booking is not available",V.message||"Please contact us directly.");return}
  U.f.mk=V.mkTick!==false;U.size=Math.min(2,V.maxParty);U.date=V.today;
  const qd=Q.get("date"),qs=+Q.get("size");if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd)&&qd>=V.today&&qd<=addD(V.today,V.ahead))U.date=qd;if(qs>=1&&qs<=V.maxParty)U.size=Math.round(qs);
  const qm=Q.get("room")||"";if(RMS().includes(qm))U.room=qm;
  const qr=(Q.get("ref")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(qr){U.af.ref=qr;U.step="find";render();return}
  loadTimes()})();
